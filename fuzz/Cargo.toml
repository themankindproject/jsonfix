[package]
name = "jsonfix-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: the fuzz crate must not join the root workspace, or
# plain `cargo test` on stable would try to build libFuzzer (nightly-only).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
jsonfix = { path = "..", features = ["serde"] }
serde = "1"

[[bin]]
name = "repair"
path = "fuzz_targets/repair.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract"
path = "fuzz_targets/extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream"
path = "fuzz_targets/stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "options"
path = "fuzz_targets/options.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bytes"
path = "fuzz_targets/bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "from_value"
path = "fuzz_targets/from_value.rs"
test = false
doc = false
bench = false
